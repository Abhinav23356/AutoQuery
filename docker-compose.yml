services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: detective
      POSTGRES_USER: detective
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-detective_dev}
      APP_PASSWORD: ${APP_PASSWORD:-app_dev}
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detective -d detective"]
      interval: 5s
      timeout: 3s
      retries: 20
  init-app-db:
    build: ./backend
    command: python /init_app_db.py
    environment:
      PGHOST: postgres
      PGDATABASE: detective
      PGUSER: detective
      PGPASSWORD: ${POSTGRES_PASSWORD:-detective_dev}
      APP_PASSWORD: ${APP_PASSWORD:-app_dev}
    volumes:
      - ./db/init_storage.py:/init_app_db.py:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    build: ./backend
    env_file: .env
    environment:
      APP_DATABASE_URL: postgresql://detective_app:${APP_PASSWORD:-app_dev}@postgres:5432/detective
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres: { condition: service_healthy }
      init-app-db: { condition: service_completed_successfully }
    ports: ["8000:8000"]
  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["5173:5173"]
volumes:
  pgdata:
